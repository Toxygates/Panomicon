version: '3'

services:
  db:
    image: postgres:12.13
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - panomicon_net
    restart: unless-stopped
    volumes:
      - fusionauth_db_data:/var/lib/postgresql/data
      - ./docker/fusionauth/sql:/docker-entrypoint-initdb.d

  fusionauth:
    image: fusionauth/fusionauth-app:1.42.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/fusionauth
      DATABASE_ROOT_USERNAME: ${POSTGRES_USER}
      DATABASE_ROOT_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      FUSIONAUTH_APP_MEMORY: ${FUSIONAUTH_APP_MEMORY}
      FUSIONAUTH_APP_RUNTIME_MODE: development
      FUSIONAUTH_APP_URL: http://fusionauth:9011
    networks:
      - panomicon_net
    restart: unless-stopped
    ports:
      - 9011:9011
    volumes:
      - fusionauth_config:/usr/local/fusionauth/config

  scalatra:
    container_name: "scalatra"
    build:
      context: .
      dockerfile: Toxygates/Dockerfile
    depends_on:
      - fusionauth
    networks:
      - panomicon_net
    restart: unless-stopped
    ports:
      - 8888:8888
    environment:
      JVM_ARGS: ${SCALATRA_JVM_ARGS}
      PORT: 8888
      T_TS_URL: ${T_TS_URL}
      T_TS_UPDATE_URL: ${T_TS_UPDATE_URL}
      T_DATA_MATDBCONFIG: ${T_DATA_MATDBCONFIG}
      T_DATA_DIR: /data
      T_TS_USER: ${T_TS_USER}
      T_TS_PASS: ${T_TS_PASS}
      T_INSTANCE_NAME: ${T_INSTANCE_NAME}
      FUSIONAUTH_BASEURL: ${FUSIONAUTH_BASEURL}
      FUSIONAUTH_APP_URL: ${FUSIONAUTH_APP_URL}
      FUSIONAUTH_CLIENTID: ${FUSIONAUTH_CLIENTID}
      FUSIONAUTH_CLIENTSECRET: ${FUSIONAUTH_CLIENTSECRET}
      REDIRECT_AFTER_AUTH_URL: ${REDIRECT_AFTER_AUTH_URL}
      JWT_ISSUER: ${JWT_ISSUER}
      RSA_PUBLIC_KEY: ${RSA_PUBLIC_KEY}
      T_INTERMINE_NAME: ${T_INTERMINE_NAME}
      T_INTERMINE_ID: ${T_INTERMINE_ID}
      T_INTERMINE_URL: ${T_INTERMINE_URL}

    volumes:
      - ${T_DATA_DIR}:/data

  toxygates:
    image: toxygates-gwt
    #container_name: "toxygates-gwt"
    #build:
    #  context: .
    #  dockerfile: Toxygates/Dockerfile.gwt
    #depends_on:
    #  - fuseki
    networks:
      - panomicon_net
    restart: unless-stopped
    ports:
      - 8080:8080
    volumes:
      - ${T_DATA_DIR}:/data
    environment:
      JAVA_OPTS : "
        ${TOMCAT_JVM_ARGS} 
        -Dtoxygates.repositoryURL=${T_TS_URL} 
        -Dtoxygates.updateURL=${T_TS_UPDATE_URL}
        -Dtoxygates.instanceName=${T_INSTANCE_NAME}
        -Dtoxygates.repositoryUser=${T_TS_USER}
        -Dtoxygates.repositoryPassword=${T_TS_PASS}
        -Dtoxygates.dataDir=/data
        -Dtoxygates.csvDir=/usr/local/tomcat/webapps/toxygates/csv
        -Dtoxygates.cvsUrlBase=${T_CSV_URLBASE}
        -Dtoxygates.feedbackReceivers=jtnystrom@gmail.com
        -Dtoxygates.feedbackFromAddress=root@panomicon.nibn.go.jp
        -Dtoxygates.intermine.target.appname=${T_INTERMINE_NAME}
        -Dtoxygates.intermine.target.title=${T_INTERMINE_ID}
        -Dtoxygates.intermine.target.userurl=${T_INTERMINE_URL}
        "

networks:
  panomicon_net:
    driver: bridge

volumes:
  fusionauth_db_data:
  fusionauth_config:
